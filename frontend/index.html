<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <!-- Faz o layout se adaptar ao tamanho da tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETA - login</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="assets/img/icone_1.png" type="image/x-icon">
</head>
<body>

    <main>
        <div>
            <img src="assets/img/layout_completo2.png" alt="Logo ETA" class="logo"><br>
        </div>
        <div>
            <form action="">
                <legend>Área de Login</legend>

                <label for="email">Email</label>
                <input type="email" id="email" name="email"/>
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha"/>
                <button id="acesso">Entrar</button>
                <button id="redefinir" href="#">Esqueci minha senha</button>
            </form>
        </div>
    </main>
    
</body>
</html>
